
# =============================================
# CONFIGURACION LOCAL DE DESARROLLO
# =============================================

# Importar configuracion privada local
spring.config.import=optional:file:./config/application-dev-local.properties

# =============================================
# BASE DE DATOS
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sge_showcase_db
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =============================================
# LOGGING
# =============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.yerandis.sge=DEBUG

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
